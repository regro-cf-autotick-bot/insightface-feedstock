{% set name = "insightface" %}
{% set version = "1.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/insightface-{{ version }}.tar.gz
  sha256: 27af24891bbba470cb3573b366a0fcca8989fc8503c9f8f281e8cba6fd716075

build:
  entry_points:
    - insightface-cli=insightface.commands.insightface_cli:main
  script: {{ PYTHON }} -m pip install . -vv
  number: 1
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
  host:
    - python
    - setuptools
    - numpy
    - cython
    - pypandoc
    - pip
    - libgl-devel                    # [linux]
  run:
    - python
    - onnx
    - onnxruntime
    - opencv
    - tqdm
    - requests
    - matplotlib-base
    - pillow
    - scipy
    - scikit-learn
    - scikit-image
    - easydict
    - cython
    - albumentations
    - prettytable

test:
  imports:
    - insightface

about:
  home: https://github.com/deepinsight/insightface
  summary: InsightFace Python Library
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jan-janssen
